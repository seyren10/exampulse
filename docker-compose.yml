services:
  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: exampulse-app
    container_name: exampulse-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    networks:
      - exampulse
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: exampulse-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - exampulse
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: exampulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: exampulse
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - exampulse
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: exampulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - exampulse

networks:
  exampulse:
    driver: bridge

volumes:
  mysql_data:
    driver: local
